# =====================================================================
# Конфигурация инструментов DDS.
#
# Единая точка настройки: pytest, ruff, mypy, Pylance (pyright).
# Пути в конфигурациях — относительно корня проекта (repository root).
# =====================================================================

[build-system]
# Проект не является installable-пакетом (не публикуется в PyPI).
# Секция нужна только для корректной работы инструментов,
# читающих pyproject.toml.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dds"
version = "1.0.0"
description = "Deep Doc Search — система поиска и анализа рабочей документации"
requires-python = ">=3.12"
readme = "README.md"


# ---------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
# Регистрация кастомных маркеров. Без неё pytest с --strict-markers
# (используется в smoke.yml) упадёт при встрече неизвестного маркера.
markers = [
    "slow: длительные тесты (fork-safety, spawn, scan.full)",
    "smoke: smoke-тесты Playwright (требуют запуска приложения)",
    "benchmark: бенчмарки производительности (требуют baseline)",
]
testpaths = ["tests"]
asyncio_mode = "auto"
# Flat-layout: пакеты dds_core/, dds_web/, tools/ лежат в корне репозитория.
# Без этого pytest не добавляет корень в sys.path, и импорты dds_core.*
# падают с ModuleNotFoundError. Параметр появился в pytest 7.0.
pythonpath = ["."]


# ---------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["dds_core", "dds_web", "tools", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # flake8-comprehensions
    "SIM",           # flake8-simplify
    "ARG",           # flake8-unused-arguments
    "RUF",           # ruff-specific
    # "PTH",         # flake8-use-pathlib: отложено на отдельную сессию
    #                # — правило косметическое, объём правок
    #                # (os.path → pathlib.Path) превышает 30 файлов.
]
ignore = [
    "E501",          # line length — контролируется formatter'ом
    "B008",          # Function call in default arg (FastAPI Depends)
    "RUF001",        # гомоглифы кириллица/латиница — ожидаемы в русскоязычном проекте
    "RUF002",        # то же для docstrings
    "RUF003",        # то же для комментариев
    # UP047 (non-pep695-generic-function): автозамена TypeVar → PEP 695
    # помечена ruff как unsafe. В helper'ах с сигнатурой
    # `Callable[[X], Coroutine[Any, Any, _T]] -> _T` (см. `_with_runner`
    # в тестах ProcessTaskRunner и `_run` в tests/_async_helpers.py)
    # преобразование неполное — остаются висячие ссылки на `_T`,
    # приводящие к NameError при импорте. Текущий TypeVar-стиль
    # корректен и полностью эквивалентен по семантике.
    "UP047",
    # SIM105 (suppressible-exception): замена `try/except/pass` на
    # `with contextlib.suppress(...)`. В 22 местах проекта блоки
    # `except` содержат комментарии, объясняющие причину подавления
    # (например, «пул закрыт, ошибка не критична», «сохранение
    # артефакта не должно маскировать падение»). Автозамена теряет
    # эти комментарии, снижая информативность кода. Текущий стиль
    # `try/except/pass` с комментарием внутри `except` — осознанный
    # выбор в пользу явной диагностики.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "S101"]  # pytest fixtures, assert
"tools/**/*.py" = ["T201"]                       # print в CLI-утилитах
# Protocol-файлы: параметры stub-методов (`...`) нужны для контракта,
# но не используются в теле. ARG002 — unused method argument.
"dds_core/domain/interfaces.py" = ["ARG002"]
"dds_core/domain/index_writer.py" = ["ARG002"]
"dds_core/domain/reference_repository.py" = ["ARG002"]


# ---------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false      # постепенно ужесточается в ходе рефакторинга
disallow_untyped_defs = false   # то же
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# PyMuPDF не публикует type stubs.
module = "fitz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF: fallback-импорт `fitz` для старых версий (<1.24.4) неизбежно
# создаёт второе определение имени `fitz` в одном модуле. Это осознанный
# паттерн совместимости; `no-redef` для этого модуля отключён. Причина —
# расхождение окружений mypy в venv (pymupdf установлен) и pre-commit
# (pymupdf отсутствует), из-за чего одна и та же директива
# `# type: ignore[no-redef]` в одном контексте нужна, а в другом
# считается неиспользуемой (`warn_unused_ignores = true`).
module = "dds_core.infrastructure.pymupdf_text_extractor"
disable_error_code = ["no-redef"]


# ---------------------------------------------------------------------
# Pylance / Pyright (VS Code)
# ---------------------------------------------------------------------
[tool.pyright]
include = ["dds_core", "dds_web", "tools", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/node_modules",
    "**/.venv",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# PyYAML не публикует stub-файлы. Инструменты в tools/
# используют try/except ImportError для понятной диагностики
# до установки зависимостей.
reportMissingModuleSource = "none"
