# =====================================================================
# Deep Doc Search — учёт устаревших символов ядра.
#
# Назначение:
#   Единый список символов, которые были удалены напрямую
#   (``type: direct_removal``) или сохранены как deprecation-обёртки
#   (``type: deprecation``) в ходе рефакторинга v9. Используется
#   двумя инструментами:
#
#     - tools/check_deprecations.py — структурная валидация записей
#       и проверка сроков удаления;
#     - tools/check_module_compatibility.py — AST-анализ внешних
#       модулей ``dds_modules/`` на использование устаревших символов.
#
# Схема записи:
#
#   symbol:               Полный путь символа (module.attr) или
#                         имя модуля. Формат — как в Python import.
#
#   type:                 ``direct_removal`` — символ удалён без
#                         deprecation-периода (модули его не
#                         использовали);
#                         ``deprecation`` — символ сохранён как
#                         обёртка до тех пор, пока его используют
#                         модули из dds_modules/.
#
#   module_users:         Список имён модулей dds_modules/,
#                         использующих символ.
#                         - Для ``direct_removal`` — обязателен
#                           пустой список (противоречие: символ
#                           удалён напрямую, значит модули его
#                           не использовали).
#                         - Для ``deprecation`` — непустой (при
#                           пустом выдаётся WARNING: deprecation
#                           без внешних потребителей).
#
#   removed_in_phase:     (только ``direct_removal``) Номер фазы
#                         плана, в которой символ удалён.
#
#   deprecated_in_phase:  (только ``deprecation``) Номер фазы, в
#                         которой символ помечен устаревшим.
#
#   remove_in_phase:      (только ``deprecation``) Номер фазы, к
#                         началу которой deprecation-обёртка
#                         должна быть удалена. Должен быть строго
#                         больше ``deprecated_in_phase``.
#
#   note:                 Опциональное пояснение (обычно ссылка
#                         на ADR и заменяющий символ).
#
# Текущая фаза проекта читается из:
#   docs/architecture-decisions/current_phase.txt
#
# Проверка:
#   python tools/check_deprecations.py
#   python tools/check_module_compatibility.py
#
# См. также:
#   - docs/architecture-decisions/README.md (правила ADR)
#   - ADR-002 (Remove Service Locator)
#   - ADR-003 (Domain Text Normalization)
#   - ADR-005 (DocumentIndexPlan)
#
# =====================================================================
# ОБНОВЛЕНИЕ В ФАЗЕ 0:
#
# Все записи изначально заполнены как ``direct_removal`` с пустым
# ``module_users``. Это исходное предположение: внешние модули
# работают через ``IModule``/``ISecondaryProcessor`` и не
# обращаются к внутренним helper'ам ядра (``TextIndexer``,
# ``SQLiteAdapter``, ``set_context``) напрямую.
#
# Если запуск ``python tools/check_module_compatibility.py``
# обнаружит реальные использования какого-либо символа в
# ``dds_modules/``, соответствующая запись ДОЛЖНА быть изменена:
#
#   - ``type``: ``direct_removal`` → ``deprecation``;
#   - добавить ``deprecated_in_phase`` (номер фазы, в которой
#     символ помечен устаревшим);
#   - добавить ``remove_in_phase`` = 10 (обёртка сохраняется до
#     конца рефакторинга);
#   - заполнить ``module_users`` именами модулей-потребителей;
#   - ``removed_in_phase`` удалить (взаимоисключающее поле).
#
# Ответственность за обновление — на авторе Фазы 0.
# =====================================================================

entries:

  # ===================================================================
  # Фаза 2 — Service Locator → request.app.state.
  #
  # Модульные глобалы в web-слое заменены на FastAPI-зависимости
  # через request.app.state. См. ADR-002.
  # ===================================================================

  - symbol: dds_web.api.set_context
    type: direct_removal
    removed_in_phase: 2
    module_users: []
    note: >
      Удалён. Заменён на request.app.state.api_context.

  - symbol: dds_web.auth.set_auth_service
    type: direct_removal
    removed_in_phase: 2
    module_users: []
    note: >
      Удалён. Заменён на request.app.state.auth_service.
