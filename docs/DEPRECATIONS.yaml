# =====================================================================
# Deep Doc Search — учёт устаревших символов ядра.
#
# Назначение:
#   Единый список символов, которые были удалены напрямую
#   (``type: direct_removal``) или сохранены как deprecation-обёртки
#   (``type: deprecation``) в ходе рефакторинга v9. Используется
#   двумя инструментами:
#
#     - tools/check_deprecations.py — структурная валидация записей
#       и проверка сроков удаления;
#     - tools/check_module_compatibility.py — AST-анализ внешних
#       модулей ``dds_modules/`` на использование устаревших символов.
#
# Схема записи:
#
#   symbol:               Полный путь символа (module.attr) или
#                         имя модуля. Формат — как в Python import.
#
#   type:                 ``direct_removal`` — символ удалён без
#                         deprecation-периода (модули его не
#                         использовали);
#                         ``deprecation`` — символ сохранён как
#                         обёртка до тех пор, пока его используют
#                         модули из dds_modules/.
#
#   module_users:         Список имён модулей dds_modules/,
#                         использующих символ.
#                         - Для ``direct_removal`` — обязателен
#                           пустой список (противоречие: символ
#                           удалён напрямую, значит модули его
#                           не использовали).
#                         - Для ``deprecation`` — непустой (при
#                           пустом выдаётся WARNING: deprecation
#                           без внешних потребителей).
#
#   removed_in_phase:     (только ``direct_removal``) Номер фазы
#                         плана, в которой символ удалён.
#
#   deprecated_in_phase:  (только ``deprecation``) Номер фазы, в
#                         которой символ помечен устаревшим.
#
#   remove_in_phase:      (только ``deprecation``) Номер фазы, к
#                         началу которой deprecation-обёртка
#                         должна быть удалена. Должен быть строго
#                         больше ``deprecated_in_phase``.
#
#   note:                 Опциональное пояснение (обычно ссылка
#                         на ADR и заменяющий символ).
#
# Текущая фаза проекта читается из:
#   docs/architecture-decisions/current_phase.txt
#
# Проверка:
#   python tools/check_deprecations.py
#   python tools/check_module_compatibility.py
#
# См. также:
#   - docs/architecture-decisions/README.md (правила ADR)
#   - ADR-002 (Remove Service Locator)   — записи Фазы 2 (удалены
#                                          из YAML в Фазе 4 по grace)
#   - ADR-003 (Domain Text Normalization) — записи Фазы 3 (удалены
#                                          из YAML в Фазе 6 по grace)
#   - ADR-004 (ProcessTaskRunner)        — запись Фазы 4 (удалена
#                                          из YAML в Фазе 6 по grace)
#   - ADR-005 (DocumentIndexPlan)        — записи Фазы 5 (удалены
#                                          из YAML в Фазе 7 по grace)
#   - ADR-006 (Server-side Terms)        — записей нет
#   - ADR-007 (Client cleanup)           — записей нет (только JS/HTML)
#   - ADR-008 (Read-side SQL cleanup)    — записи Фазы 8 (актуальны)
#
# =====================================================================
# ПРАВИЛА ВЕДЕНИЯ ФАЙЛА:
#
# 1. Запись добавляется в момент фактического удаления символа
#    (при выполнении соответствующей фазы), а не заранее.
#    Причина: ``direct_removal`` описывает УЖЕ ВЫПОЛНЕННОЕ удаление.
#    Запись с ``removed_in_phase > current_phase`` даёт ERROR в
#    tools/check_deprecations.py («удаление запланировано на будущую
#    фазу, но помечено как сделанное»).
#
# 2. Записи предыдущих фаз удаляются из файла через 2 фазы после
#    их появления (grace = _DIRECT_REMOVAL_GRACE_PHASES в
#    check_deprecations.py). Раньше — по желанию автора фазы.
#    По истечении grace-периода на запись выдаётся WARNING
#    «устаревшая запись direct_removal — можно удалить из YAML».
#
# 3. Если внешний модуль из ``dds_modules/`` использует удаляемый
#    символ, тип записи меняется на ``deprecation`` и заполняются
#    ``module_users``, ``deprecated_in_phase``, ``remove_in_phase``.
#    Ответственность за перепроверку — на авторе фазы: перед
#    удалением следует запустить check_module_compatibility.py.
#
# =====================================================================
# ПРИМЕЧАНИЕ О ФАЗЕ 8 (ADR-008, Read-side SQL cleanup):
#
#   Фаза 8 затронула три конструктора application-слоя:
#   ``TextIndexer.__init__``, ``SearchEngine.__init__``,
#   ``DocumentCache.__init__``. В каждом параметр ``db: IDatabase``
#   заменён на ``document_repository: IDocumentRepository``.
#
#   Breaking change: кастомные реализации ``ITextIndexer`` (если
#   появятся), а также прямой код, инстанцирующий эти классы с
#   позиционным третьим аргументом ``IDatabase``, потребуют правки.
#   В текущем проекте прямых потребителей, кроме
#   ``dds_web/lifespan.py::create_components`` (обновлён в Фазе 8),
#   нет. ``dds_modules/`` не затронуты — внешние модули работают
#   через ``IModule`` / ``ISecondaryProcessor`` и не зависят от
#   application-классов напрямую.
#
# =====================================================================

entries:
  # -------------------------------------------------------------------
  # Фаза 8 (ADR-008): Read-side SQL cleanup.
  #
  # Замена параметра ``db: IDatabase`` на
  # ``document_repository: IDocumentRepository`` в трёх конструкторах
  # application-слоя. SQL-строки read-side выведены из application
  # и сосредоточены в infrastructure
  # (``SqliteDocumentRepository``).
  # -------------------------------------------------------------------

  - symbol: dds_core.application.indexer.TextIndexer.__init__
    type: direct_removal
    module_users: []
    removed_in_phase: 8
    note: >
      Параметр db (IDatabase) заменён на document_repository
      (IDocumentRepository). Read-side доступ к документам
      делегируется в репозиторий; application-слой не содержит
      SQL-строк ни на запись, ни на чтение. См. ADR-008.

  - symbol: dds_core.application.search_engine.SearchEngine.__init__
    type: direct_removal
    module_users: []
    removed_in_phase: 8
    note: >
      Параметр db (IDatabase) заменён на document_repository
      (IDocumentRepository). Методы get_document_info и get_page_text
      делегируют чтение в репозиторий. См. ADR-008.

  - symbol: dds_core.application.document_cache.DocumentCache.__init__
    type: direct_removal
    module_users: []
    removed_in_phase: 8
    note: >
      Параметр db (IDatabase) заменён на document_repository
      (IDocumentRepository). Метод load использует
      IDocumentRepository.load_all(). См. ADR-008.
